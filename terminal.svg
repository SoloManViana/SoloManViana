<svg fill="none" viewBox="0 0 320 170" width="320" height="170" xmlns="http://w3.org">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://w3.org">
      <style>
        .container {
          background-color: #000000;
          border: 2px solid #1cff03;
          border-radius: 8px;
          padding: 15px;
          font-family: monospace;
          font-size: 13px;
          line-height: 1.6;
          box-sizing: border-box;
          width: 320px;
          height: 170px;
        }
        .green-text { color: #1cff03; }
        .yellow-text { color: #c8ff03; }
        .red-text { color: #ff0000; }
        .line { margin-bottom: 6px; display: block; }
      </style>

      <div class="container">
        <span class="line green-text">$ Hello my name is Eduardo...</span>
        <span class="line green-text">$ Back-end Developer</span>
        <span class="line green-text">$ Intermediate English</span>
        <span class="line green-text">$ Web Programmer</span>
        <span class="line yellow-text">👾 Warning !! <span class="red-text">Scroll down to see more</span></span>
      </div>
    </div>
  </foreignObject>
</svg>
